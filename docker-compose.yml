services:
  postgres:
    image: postgres:15-alpine
    container_name: smartrec-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrec_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smartrec-net

  redis:
    image: redis:7-alpine
    container_name: smartrec-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - smartrec-net

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: smartrec-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - smartrec-net

  # Script tự động khởi tạo Bucket cho MinIO
  minio-init:
    image: ghcr.io/coollabsio/minio:latest
    container_name: smartrec-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET:-smartrec-media} --ignore-existing;
      printf '%s\n' '[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"Content-Type\",\"Authorization\",\"x-amz-date\",\"x-amz-content-sha256\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]' > /tmp/minio-cors.json;
      /usr/bin/mc cors set myminio/${MINIO_BUCKET:-smartrec-media} /tmp/minio-cors.json;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET:-smartrec-media};
      exit 0;
      "
    networks:
      - smartrec-net

  # Database Vector cho cụm AI Engine
  chromadb:
    image: chromadb/chroma:latest
    container_name: smartrec-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - smartrec-net

  ai-engine:
    build:
      context: ./ai-engine
    container_name: smartrec-ai-engine
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartrec-media}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      LOCAL_LLM_ENDPOINT: ${LOCAL_LLM_ENDPOINT:-http://host.docker.internal:11434/api/generate}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:3b-instruct-q4_K_M}
      SMARTREC_LLM_ENABLED: ${SMARTREC_LLM_ENABLED:-true}
      SMARTREC_ENVIRONMENT: ${SMARTREC_ENVIRONMENT:-production}
      SMARTREC_LLM_DEBUG_CAPTURE_ENABLED: ${SMARTREC_LLM_DEBUG_CAPTURE_ENABLED:-false}
      SMARTREC_LLM_DEBUG_DIR: /var/lib/smartrec/llm-debug
      SMARTREC_LLM_DEBUG_RETENTION_HOURS: ${SMARTREC_LLM_DEBUG_RETENTION_HOURS:-24}
      SMARTREC_LLM_DEBUG_MAX_CAPTURE_BYTES: ${SMARTREC_LLM_DEBUG_MAX_CAPTURE_BYTES:-524288}
      SMARTREC_LLM_DEBUG_MAX_TOTAL_BYTES: ${SMARTREC_LLM_DEBUG_MAX_TOTAL_BYTES:-16777216}
      SMARTREC_INTERNAL_TOKEN: ${SMARTREC_INTERNAL_TOKEN:?Set SMARTREC_INTERNAL_TOKEN in your environment}
      SMARTREC_WORKSPACE_ROOT: /tmp/smartrec_workspace
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}

      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      PYANNOTE_CACHE: /root/.cache/huggingface/hub
      STT_MODEL_ID: ${STT_MODEL_ID:-faster-whisper-small}
      WHISPER_MODEL_PATH: /models/${STT_MODEL_ID:-faster-whisper-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8082/api/v1}
      OCR_RECOGNITION_MODEL_DIR: ${OCR_RECOGNITION_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_rec}
      OCR_DETECTION_MODEL_DIR: ${OCR_DETECTION_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_det}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      - redis
      - minio
      - chromadb
    volumes:
      - ${SMARTREC_MODELS_DIR:?Set SMARTREC_MODELS_DIR to an absolute host path}:/models:ro
      - ${SMARTREC_HF_CACHE_DIR:?Set SMARTREC_HF_CACHE_DIR to an absolute path}:/root/.cache/huggingface:ro
      - smartrec_llm_debug:/var/lib/smartrec/llm-debug
    restart: unless-stopped
    networks:
      - smartrec-net

  ai-worker:
    # Compatibility-only: the supported local pipeline uses one native macOS
    # worker. Ordinary compose up must not start a second queue consumer.
    profiles:
      - docker-worker-compat
    build:
      context: ./ai-engine
    container_name: smartrec-ai-worker
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
      ]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartrec-media}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      SMARTREC_LLM_ENABLED: ${SMARTREC_LLM_ENABLED:-true}
      SMARTREC_INTERNAL_TOKEN: ${SMARTREC_INTERNAL_TOKEN:?Set SMARTREC_INTERNAL_TOKEN in your environment}
      SMARTREC_WORKSPACE_ROOT: /tmp/smartrec_workspace
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-cpu}

      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      PYANNOTE_CACHE: /root/.cache/huggingface/hub

      STT_MODEL_ID: ${STT_MODEL_ID:-faster-whisper-small}

      WHISPER_MODEL_PATH: /models/${STT_MODEL_ID:-faster-whisper-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      SMARTREC_HEARTBEAT_INTERVAL_SECONDS: ${SMARTREC_HEARTBEAT_INTERVAL_SECONDS:-12}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8082/api/v1}
      OCR_RECOGNITION_MODEL_DIR: ${OCR_RECOGNITION_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_rec}
      OCR_DETECTION_MODEL_DIR: ${OCR_DETECTION_MODEL_DIR:-/models/paddleocr/PP-OCRv6_medium_det}
      HF_TOKEN: ${HF_TOKEN:-}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
    depends_on:
      - redis
      - minio
    volumes:
      - ${SMARTREC_MODELS_DIR:?Set SMARTREC_MODELS_DIR to an absolute host path}:/models:ro
      - ${SMARTREC_HF_CACHE_DIR:?Set SMARTREC_HF_CACHE_DIR to an absolute path}:/root/.cache/huggingface:ro
    restart: unless-stopped
    networks:
      - smartrec-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
  smartrec_llm_debug:

networks:
  smartrec-net:
    driver: bridge
