server:
  port: 8082
  servlet:
    context-path: /api/v1

spring:
  application:
    name: smartrec-backend
  profiles:
    active: dev

  # 1. CSDL PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartrec_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

  # 2. Redis Configuration (Message Broker)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 3. Giới hạn upload file lớn (Chunked Upload support)
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  # 4. Custom JWT Configuration (Thay thế hoàn toàn Keycloak)
jwt:
  # Chuỗi khóa bí mật (Secret Key) - Dùng 1 chuỗi Hex 256-bit dài để bảo mật
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Thời gian sống của Token: 86400000 milliseconds = 24 giờ
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
# 5. MinIO Object Storage Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:smartrec-media}
  slide-bucket-name: ${MINIO_SLIDE_BUCKET:smartrec-slides}
  playback-url-expiry-seconds: ${MINIO_PLAYBACK_URL_EXPIRY_SECONDS:900}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

trash:
  retention-days: ${TRASH_RETENTION_DAYS:30}
  purge-cron: "${TRASH_PURGE_CRON:0 0 2 * * *}"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

media:
  max-duration-hours: 4

job:
  max-retry: 5
  heartbeat-timeout-seconds: ${JOB_HEARTBEAT_TIMEOUT_SECONDS:90}
  watchdog-scan-interval-ms: ${JOB_WATCHDOG_SCAN_INTERVAL_MS:30000}

smartrec:
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://localhost:8000}
    prepare-path: ${AI_ENGINE_PREPARE_PATH:/api/v1/internal/llm/prepare}
    generate-path: ${AI_ENGINE_GENERATE_PATH:/api/v1/internal/llm/generate}
    validate-path: ${AI_ENGINE_VALIDATE_PATH:/api/v1/internal/llm/validate}
    internal-token: ${smartrec.internal-token}
    connect-timeout: ${AI_ENGINE_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_ENGINE_READ_TIMEOUT:130000}
  ai-router:
    local-max-attempts: ${AI_LOCAL_MAX_ATTEMPTS:2}
    local-retry-backoff-ms: ${AI_LOCAL_RETRY_BACKOFF_MS:100}
    local-circuit-failure-threshold: ${AI_LOCAL_CIRCUIT_FAILURE_THRESHOLD:3}
    local-circuit-open-ms: ${AI_LOCAL_CIRCUIT_OPEN_MS:30000}
    gemini-fallback-enabled: ${GEMINI_FALLBACK_ENABLED:false}
    gemini-data-sharing-approved: ${GEMINI_DATA_SHARING_APPROVED:false}
    gemini-redaction-policy-version: ${GEMINI_REDACTION_POLICY_VERSION:}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:}
    gemini-timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
    gemini-max-attempts: ${GEMINI_MAX_ATTEMPTS:1}
    gemini-max-requests-per-job: ${GEMINI_MAX_REQUESTS_PER_JOB:0}
    gemini-max-cost-per-job-usd: ${GEMINI_MAX_COST_PER_JOB_USD:0}
    gemini-max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}
  internal-token: ${SMARTREC_INTERNAL_TOKEN:}

  stt:
    request-path: ${STT_REQUEST_PATH:/api/v1/stt}
    default-model: ${STT_DEFAULT_MODEL:default-stt}
    default-language: ${STT_DEFAULT_LANGUAGE:vi}

  ai-stt:
    base-url: ${AI_WORKER_BASE_URL:http://localhost:8000}
    transcribe-path: ${AI_WORKER_TRANSCRIBE_PATH:/ai/stt/transcribe}
    model-name: ${AI_STT_MODEL_NAME:faster-whisper-large-v3}
    model-version: "1.0.0"

google:
  client-id: 341602707586-r5nt4c35p4jvgf1gii86b7459vfgkln0.apps.googleusercontent.com
