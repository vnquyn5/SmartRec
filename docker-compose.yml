services:
  postgres:
    image: postgres:15-alpine
    container_name: smartrec-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartrec_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smartrec-net

  redis:
    image: redis:7-alpine
    container_name: smartrec-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - smartrec-net

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: smartrec-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - smartrec-net

  # Script tự động khởi tạo Bucket cho MinIO
  minio-init:
    image: ghcr.io/coollabsio/minio:latest
    container_name: smartrec-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET:-smartrec-media} --ignore-existing;
      printf '%s\n' '[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"Content-Type\",\"Authorization\",\"x-amz-date\",\"x-amz-content-sha256\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]' > /tmp/minio-cors.json;
      /usr/bin/mc cors set myminio/${MINIO_BUCKET:-smartrec-media} /tmp/minio-cors.json;
      /usr/bin/mc anonymous set none myminio/${MINIO_BUCKET:-smartrec-media};
      exit 0;
      "
    networks:
      - smartrec-net

  # Database Vector cho cụm AI Engine
  chromadb:
    image: chromadb/chroma:latest
    container_name: smartrec-chromadb
    profiles: ["vector"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - smartrec-net

  ai-engine:
    build:
      context: ./ai-engine
    container_name: smartrec-ai-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartrec-media}
      SMARTREC_INTERNAL_TOKEN: ${SMARTREC_INTERNAL_TOKEN:?Set SMARTREC_INTERNAL_TOKEN in your environment}
      SMARTREC_WORKSPACE_ROOT: /tmp/smartrec_workspace
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-auto}
      STT_PROVIDER: ${STT_PROVIDER:-whisper_cpp}
      STT_MODEL_PATH: ${STT_MODEL_PATH:-}
      WHISPER_CPP_URL: ${WHISPER_CPP_URL:-http://host.docker.internal:8081/inference}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-3600}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-3072}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-900}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8082/api/v1}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    networks:
      - smartrec-net

  ai-worker:
    build:
      context: ./ai-engine
    container_name: smartrec-ai-worker
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-1}",
      ]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartrec-media}
      SMARTREC_INTERNAL_TOKEN: ${SMARTREC_INTERNAL_TOKEN:?Set SMARTREC_INTERNAL_TOKEN in your environment}
      SMARTREC_WORKSPACE_ROOT: /tmp/smartrec_workspace
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE:-auto}
      DIARIZATION_BACKEND: ${DIARIZATION_BACKEND:-local}
      PYANNOTE_NATIVE_URL: ${PYANNOTE_NATIVE_URL:-http://host.docker.internal:8086}
      PYANNOTE_NATIVE_TOKEN: ${PYANNOTE_NATIVE_TOKEN:-}
      STT_PROVIDER: ${STT_PROVIDER:-whisper_cpp}
      STT_MODEL_PATH: ${STT_MODEL_PATH:-}
      WHISPER_CPP_URL: ${WHISPER_CPP_URL:-http://host.docker.internal:8081/inference}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-3600}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-3072}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-900}
      SMARTREC_HEARTBEAT_INTERVAL_SECONDS: ${SMARTREC_HEARTBEAT_INTERVAL_SECONDS:-12}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8082/api/v1}
      HF_TOKEN: ${HF_TOKEN:-}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      PYTORCH_NUM_THREADS: "2"
      PYTORCH_INTEROP_THREADS: "2"
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    networks:
      - smartrec-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:

networks:
  smartrec-net:
    driver: bridge
